name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: vet, test and build both architectures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: pwsh
        run: |
          $out = gofmt -l cmd internal
          if ($out) { Write-Host "not gofmt'd:"; Write-Host $out; exit 1 }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: install rsrc
        run: go install github.com/akavel/rsrc@latest

      - name: build amd64
        shell: pwsh
        run: ./scripts/build.ps1 -Arch amd64

      - name: build arm64
        shell: pwsh
        run: ./scripts/build.ps1 -Arch arm64

      - name: upload amd64
        uses: actions/upload-artifact@v4
        with:
          name: wudo-amd64
          path: bin/amd64/*.exe
          if-no-files-found: error

      - name: upload arm64
        uses: actions/upload-artifact@v4
        with:
          name: wudo-arm64
          path: bin/arm64/*.exe
          if-no-files-found: error

  release:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install rsrc
        run: go install github.com/akavel/rsrc@latest

      - name: build both architectures
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Arch amd64
          ./scripts/build.ps1 -Arch arm64

      - name: pack
        shell: pwsh
        run: |
          foreach ($arch in @('amd64', 'arm64')) {
            Compress-Archive -Path "bin/$arch/*.exe" -DestinationPath "wudo-$arch.zip" -Force
          }

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wudo-amd64.zip
            wudo-arm64.zip
          generate_release_notes: true
